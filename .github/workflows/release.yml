name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            framework: net10.0-windows10.0.17763.0
          - os: macos-26
            rid: osx-arm64
            framework: net10.0-macos
          - os: macos-26-intel
            rid: osx-x64
            framework: net10.0-macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install macOS workload
        if: startsWith(matrix.os, 'macos-')
        run: dotnet workload install macos
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.fsproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - run: dotnet restore src/Liangwengu/Liangwengu.fsproj -r ${{ matrix.rid }} -p:TargetFramework=${{ matrix.framework }}
      - run: dotnet restore tests/Liangwengu.Tests/Liangwengu.Tests.fsproj -r ${{ matrix.rid }} -p:TargetFramework=${{ matrix.framework }}
      - run: dotnet build tests/Liangwengu.Tests/Liangwengu.Tests.fsproj -c Release -f ${{ matrix.framework }} -r ${{ matrix.rid }} --no-restore
      - run: dotnet test tests/Liangwengu.Tests/Liangwengu.Tests.fsproj -c Release -f ${{ matrix.framework }} -r ${{ matrix.rid }} --no-build --filter "Category!=Integration"

  publish-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.fsproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - uses: extractions/setup-just@v3
        with:
          just-version: 1.58.0

      - name: Publish single-file exe
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_VERSION.TrimStart('v')
          just publish-windows $version

      - name: Verify single exe
        shell: pwsh
        run: |
          $publishDir = "artifacts/windows-x64"
          $exes = @(Get-ChildItem $publishDir -Filter *.exe -File)
          if ($exes.Count -ne 1 -or $exes[0].Name -ne "liangwengu.exe") {
            Write-Error "publish directory must contain only liangwengu.exe, found: $($exes.Name -join ', ')"
            exit 1
          }
          $leftover = @(Get-ChildItem $publishDir | Where-Object { $_.Extension -ne '.exe' })
          if ($leftover) {
            Write-Error "publish directory has non-exe leftovers (breaks single-file contract): $($leftover.Name -join ', ')"
            exit 1
          }
          Write-Host "Single-exe check passed: $($exes[0].Name), $([math]::Round($exes[0].Length/1MB,1)) MB"

      - name: Rename with version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          Move-Item `
            artifacts/windows-x64/liangwengu.exe `
            liangwengu-${tag}-win-x64.exe

      - name: Generate sha256
        shell: pwsh
        run: |
          $file = Get-Item liangwengu-*-win-x64.exe
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  $($file.Name)" | Out-File -Encoding utf8 sha256sum.txt
          Get-Content sha256sum.txt

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            liangwengu-*-win-x64.exe
            sha256sum.txt

  publish-macos:
    needs: test
    strategy:
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install macOS workload
        run: dotnet workload install macos

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.fsproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - uses: extractions/setup-just@v3
        with:
          just-version: 1.58.0

      - name: Build macOS DMG
        run: just publish-macos ${{ matrix.arch }} "${GITHUB_REF_NAME#v}"
      - name: Generate SHA256
        run: |
          cd artifacts/macos-${{ matrix.arch }}
          shasum -a 256 *.dmg > sha256-macos-${{ matrix.arch }}.txt
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: |
            artifacts/macos-${{ matrix.arch }}/*.dmg
            artifacts/macos-${{ matrix.arch }}/sha256-macos-${{ matrix.arch }}.txt

  release:
    needs: [publish-windows, publish-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
