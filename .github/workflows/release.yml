name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.fsproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - run: dotnet restore -r win-x64
      - run: dotnet build -c Release -r win-x64 --no-restore
      - run: dotnet test -c Release -r win-x64 --no-build

  publish:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.fsproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Publish single-file exe
        run: |
          dotnet publish src/Liangwengu/Liangwengu.fsproj `
            -c Release -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true

      - name: Verify single exe
        shell: pwsh
        run: |
          $publishDir = "src/Liangwengu/bin/Release/net8.0/win-x64/publish"
          $exes = Get-ChildItem $publishDir -Filter *.exe
          if ($exes.Count -ne 1 -or $exes[0].Name -ne "liangwengu.exe") {
            Write-Error "publish directory must contain only liangwengu.exe, found: $($exes.Name -join ', ')"
            exit 1
          }
          $leftover = Get-ChildItem $publishDir | Where-Object { $_.Extension -notin @('.exe','.pdb') }
          if ($leftover) {
            Write-Error "publish directory has non-exe/pdb leftovers (breaks single-file contract): $($leftover.Name -join ', ')"
            exit 1
          }
          Write-Host "Single-exe check passed: $($exes[0].Name), $([math]::Round($exes[0].Length/1MB,1)) MB"

      - name: Rename with version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          Move-Item `
            src/Liangwengu/bin/Release/net8.0/win-x64/publish/liangwengu.exe `
            liangwengu-${tag}-win-x64.exe

      - name: Generate sha256
        shell: pwsh
        run: |
          $file = Get-Item liangwengu-*-win-x64.exe
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  $($file.Name)" | Out-File -Encoding utf8 sha256sum.txt
          Get-Content sha256sum.txt

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            liangwengu-*-win-x64.exe
            sha256sum.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
