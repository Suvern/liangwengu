name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            framework: net10.0-windows10.0.17763.0
          - os: macos-26
            rid: osx-arm64
            framework: net10.0-macos
          - os: macos-26-intel
            rid: osx-x64
            framework: net10.0-macos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install macOS workload
        if: startsWith(matrix.framework, 'net10.0-macos')
        run: dotnet workload install macos

      - uses: extractions/setup-just@v3
        with:
          just-version: 1.58.0

      - name: Check F# formatting
        run: just format-check

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.fsproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore main project
        run: dotnet restore src/Liangwengu/Liangwengu.fsproj -r ${{ matrix.rid }} -p:TargetFramework=${{ matrix.framework }}

      - name: Restore test project
        run: dotnet restore tests/Liangwengu.Tests/Liangwengu.Tests.fsproj -r ${{ matrix.rid }} -p:TargetFramework=${{ matrix.framework }}

      - name: Build main project
        run: dotnet build src/Liangwengu/Liangwengu.fsproj -c Release -f ${{ matrix.framework }} -r ${{ matrix.rid }} --no-restore

      - name: Build test project
        run: dotnet build tests/Liangwengu.Tests/Liangwengu.Tests.fsproj -c Release -f ${{ matrix.framework }} -r ${{ matrix.rid }} --no-restore

      - name: Test
        run: dotnet test tests/Liangwengu.Tests/Liangwengu.Tests.fsproj -c Release -f ${{ matrix.framework }} -r ${{ matrix.rid }} --no-build --filter "Category!=Integration" --verbosity normal

      - name: Publish dev Windows exe
        if: github.event_name == 'pull_request' && matrix.os == 'windows-latest'
        run: just publish-windows

      - name: Upload dev exe (PR preview)
        if: github.event_name == 'pull_request' && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: liangwengu-pr-${{ github.event.pull_request.number }}
          path: artifacts/windows-x64/liangwengu.exe
          retention-days: 7
