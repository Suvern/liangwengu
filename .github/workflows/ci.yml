name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.fsproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore -r win-x64

      - name: Build
        run: dotnet build -c Release -r win-x64 --no-restore

      - name: Test
        run: dotnet test -c Release -r win-x64 --no-build --verbosity normal

      - name: Upload dev exe (PR preview)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: liangwengu-pr-${{ github.event.pull_request.number }}
          path: src/Liangwengu/bin/Release/net8.0/win-x64/publish/liangwengu.exe
          retention-days: 7
