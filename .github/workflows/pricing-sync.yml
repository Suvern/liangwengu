name: pricing-sync

on:
  push:
    paths:
      - '.github/workflows/pricing-sync.yml'
  schedule:
    - cron: '5 0 * * *'  # 每天 00:05 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/pricing-snapshot
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - run: npm ci --no-audit --no-fund

      - name: Run sync
        id: r
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: npx tsx src/sync.ts >> "$GITHUB_STEP_SUMMARY"

      # 新规则超出 schema 能力时，不提交不完整 pricing.json；创建一次待处理 Issue。
      - name: Create issue — schema bump
        if: steps.r.outputs.bumpNeeded == 'true'
        uses: actions/github-script@v7
        env:
          BUMP_REASON: ${{ steps.r.outputs.bumpReason }}
        with:
          script: |
            const title = 'pricing: schema bump needed';
            const { owner, repo } = context.repo;
            const { data: labels } = await github.rest.issues.listLabelsForRepo({ owner, repo, per_page: 100 });
            if (!labels.some((label) => label.name === 'schema-bump')) {
              await github.rest.issues.createLabel({ owner, repo, name: 'schema-bump', color: 'd93f0b' });
            }
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: 'schema-bump',
              per_page: 100,
            });
            const existing = openIssues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              core.info(`Schema bump is already tracked in #${existing.number}.`);
            } else {
              const body = [
                'The pricing page contains information the current snapshot schema cannot represent.',
                '',
                `> ${process.env.BUMP_REASON || 'No reason was provided by the parser.'}`,
                '',
                'Review the source change, update the schema and app reader, then publish a compatible app before switching `pricing.json`.',
              ].join('\n');
              const { data: created } = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: ['schema-bump'],
              });
              core.info(`Created schema bump issue #${created.number}.`);
            }

      - name: Create PR — data update
        if: steps.r.outputs.dataChanged == 'true' && steps.r.outputs.bumpNeeded != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'chore(pricing): update pricing snapshot'
          title: 'pricing: 定价数据更新'
          body: |
            定价快照发生变化。请审核价格、峰时规则及内嵌节假日日期后合并。

            - Pricing page changed: `${{ steps.r.outputs.hashChanged }}`
            - Holiday calendar changed: `${{ steps.r.outputs.calendarChanged }}`
          branch: pricing-sync
          add-paths: pricing.json
          labels: pricing-data

      # 仅 sourceHash 变（HTML 变了但提取数据没变）→ 直接 push
      # working-directory: ./ 覆盖 job-level 的 scripts/pricing-snapshot，
      # 否则 git add pricing.json 会因 cwd 不对找不到根目录下的 pricing.json
      - name: Auto-commit metadata-only change
        if: steps.r.outputs.hashChanged == 'true' && steps.r.outputs.dataChanged != 'true' && steps.r.outputs.bumpNeeded != 'true'
        working-directory: ./
        run: |
          git config user.name  github-actions[bot]
          git config user.email github-actions@noreply
          git add pricing.json
          git commit -m "chore(pricing): metadata-only refresh (sourceHash changed, data unchanged)" || exit 0
          git push
